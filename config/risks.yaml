    power materially less traceable, contestable or reviewable.'
  - '(ii) Equality and human rights: cumulative or scaled deployment entrenches structural disadvantage or exclusion
    affecting minorities or vulnerable groups.'
  - '(iii) Power concentration / surveillance: the system materially increases asymmetry of information or control,
    including through pervasive monitoring, profiling or function creep.'
  - '(iv) Democratic / institutional effects: deployment at scale affects pluralism, participation, institutional
    trust or the effective operation of legal safeguards.'
  - '(v) Normalisation effect: repeated use makes rights-sensitive practices routine without adequate legal justification,
    oversight, review or remedy.'
