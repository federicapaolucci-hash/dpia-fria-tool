    delimited intended purpose; meaningful human oversight; transparency and reasons; contestability and redress;
    equality/bias controls; necessity and proportionality reasoning; DPIA/FRIA where applicable; stakeholder engagement
    where relevant; independent supervision; monitoring of cumulative/systemic effects and review triggers.'
  candidate_mitigation_text: Define explicit limits on intended purpose and constitutionally sensitive uses; strengthen
    meaningful human review and the right to be heard; accessible information and non-digital alternatives where
    needed; structured SEP with affected groups/civil society where relevant; monitor cumulative/systemic effects
    with escalation thresholds; periodic reassessment and independent review when purpose, scale or deployment context
    materially changes.
