- trigger: Material uncertainty about actual impact
  default_consequence: SEP may supply contextual evidence
  automatic: false
  notes: Unknown remains unknown until evidence exists
- trigger: Provider assumptions differ from deployment context
  default_consequence: Use SEP to test context/impact assumptions where appropriate
  automatic: false
  notes: Particularly relevant for deployer FRIA
- trigger: Need to validate practical effectiveness of safeguard
  default_consequence: SEP/testing may inform adequacy
